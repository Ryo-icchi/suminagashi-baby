<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>すみながし</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!-- iOS PWA（ホーム画面追加でフルスクリーン起動） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="すみながし">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #f1ebde;
    /* 1歳児対策: スクロール・ズーム・長押し選択・コールアウトを全て無効化 */
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }

  /* ---- UI（1歳児向け: 普段は小さなボタン2つだけ・キャンバスを邪魔しない） ----
     左下🎨=パレット開閉（色を選ぶと自動で閉じる）/ 右下🌊=洗い流す。
     パレットは🎨の上に縦に並べて開く: 幅に依存しないので iPhone でも被らない */
  .fab {
    position: fixed;
    width: 54px; height: 54px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.55);
    background: rgba(241, 235, 222, 0.82);
    box-shadow: 0 2px 14px rgba(60, 50, 30, 0.22);
    font-size: 26px; line-height: 1;
    padding: 0;
    touch-action: none;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .fab:active { transform: scale(0.92); }
  #palBtn {
    left: calc(14px + env(safe-area-inset-left, 0px));
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  }
  #washBtn {
    right: calc(14px + env(safe-area-inset-right, 0px));
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  }
  #palette {
    position: fixed;
    left: calc(14px + env(safe-area-inset-left, 0px));
    bottom: calc(78px + env(safe-area-inset-bottom, 0px));  /* 🎨ボタンの真上 */
    display: none;
    flex-direction: column-reverse;  /* おまかせが一番下（🎨に近い）*/
    gap: 10px;
    padding: 10px;
    background: rgba(241, 235, 222, 0.82);
    border-radius: 999px;
    box-shadow: 0 2px 14px rgba(60, 50, 30, 0.22);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    touch-action: none;
    max-height: calc(100vh - 110px);
    overflow: hidden;
  }
  #palette.open { display: flex; }
  #palette { flex-wrap: wrap; }  /* 背が低い端末では2列目に折り返す（はみ出し切れ防止） */
  .sw {
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.55);
    box-shadow: 0 1px 4px rgba(60, 50, 30, 0.25);
    padding: 0;
    flex: none;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .sw.sel {
    border-color: #6b5d49;
    transform: scale(1.12);
  }
  /* 背が低い端末（横持ちiPhone等）は縦一列が入らないのでスウォッチを縮める */
  @media (max-height: 480px) {
    .sw { width: 36px; height: 36px; }
    #palette { gap: 7px; padding: 8px; }
  }

  /* ---- FXオーバーレイ（波紋リング・金魚・桜）。タッチは透過 ---- */
  #fx { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; }

  /* ---- こどもロック: FABを隠す（親パネルは4本指1.5秒ホールドで開く） ---- */
  body.locked .fab { display: none; }
  body.locked #palette { display: none !important; }

  /* ---- おうちのかたメニュー（🎨を2.5秒長押し / 4本指1.5秒ホールド） ---- */
  #panel {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: none; flex-direction: column; gap: 11px;
    padding: 18px 20px;
    background: rgba(241, 235, 222, 0.97);
    border-radius: 22px;
    box-shadow: 0 6px 30px rgba(60, 50, 30, 0.35);
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    color: #5a4f3d;
    width: min(330px, 88vw); max-height: 86vh; overflow-y: auto;
  }
  #panel.open { display: flex; }
  #panel h2 { margin: 0 0 3px; font-size: 15px; font-weight: 600; text-align: center; }
  .prow { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 14px; }
  .prow small { color: #9a8d77; font-size: 11px; }
  .pbtn {
    min-width: 98px; padding: 10px 12px; border-radius: 999px;
    border: 2px solid rgba(107, 93, 73, 0.35); background: #fff;
    font-size: 14px; color: #5a4f3d; font-family: inherit;
  }
  .pbtn.on { background: #6b5d49; color: #fff; border-color: #6b5d49; }
  #panelClose {
    margin-top: 4px; background: #6b5d49; color: #fff; border: none;
    padding: 12px; border-radius: 999px; font-size: 15px; font-family: inherit;
  }

  /* ---- おやすみ（タイマー満了）: 夕焼けにゆっくり沈む ---- */
  #sunset {
    position: fixed; inset: 0; z-index: 10;
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: linear-gradient(180deg, #2b2640 0%, #5d3a55 48%, #c97a4a 100%);
    opacity: 0; transition: opacity 6s ease;
    font-family: -apple-system, "Hiragino Sans", sans-serif;
  }
  #sunset.on { display: flex; }
  #sunset.visible { opacity: 1; }
  #sunset .moon { font-size: 76px; }
  #sunset .msg { color: rgba(255, 243, 224, 0.9); font-size: 19px; }
  #sunset .hint { color: rgba(255, 243, 224, 0.4); font-size: 11px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="fx"></canvas>
<div id="palette"></div>
<button id="palBtn" class="fab" aria-label="いろをえらぶ">🎨</button>
<button id="washBtn" class="fab" aria-label="ながす">🌊</button>
<div id="panel"></div>
<div id="sunset">
  <div class="moon" id="moon">🌙</div>
  <div class="msg">きょうは おしまい</div>
  <div class="hint">おとなのひと: つきを 2びょう ながおし</div>
</div>
<script>
"use strict";
console.log("SUMI build: v4.3-kirei");
window.onerror = (msg, src, line) => { console.log("SUMI ERROR: " + msg + " @" + line); };

/* ============================================================
 * すみながし（1歳児向け）— WebGL 流体シミュレーション版
 *
 * 視覚仕様は参考サイト（墨流し — Ink Dissolution）のスクリーンショット:
 *   和紙テクスチャの上を、墨がにじみ・流れ・ゆっくり拡散する。
 *   エッジは羽毛状。墨黒が主体で朱・藍はごく淡く。
 *
 * 実装: stable fluids（半ラグランジュ移流 + 圧力投影 + 渦度強化）
 *       + 墨の吸収モデル（paper * exp(-dye)）+ 和紙ノイズシェーダ
 *
 * 操作（説明不要設計）:
 *   タッチ      → 墨滴がぽとりと落ちて、ゆっくりにじむ
 *   なぞる      → 墨が流れる
 *   左下🎨      → パレット開閉。色を選ぶと自動で閉じて中央に試し滴
 *   右下🌊      → 洗い流してリセット（3本指ホールドと同じ）
 *   12秒放置    → 自動演出（ゆるやかな筆運びが勝手に始まる）
 *   3本指ホールド→ 洗い流す（親用）
 * ============================================================ */

const canvas = document.getElementById("c");

/* ---------------- 設定 ---------------- */
const config = {
  SIM_RESOLUTION: 128,        // 速度場の解像度
  DYE_RESOLUTION: 768,        // 墨の解像度
  DENSITY_DISSIPATION: 0.35,  // 墨の消えにくさ（小さいほど残る）。約8-10秒で薄れて画面が回復する
                              // （0.22→0.35: Ryo FB 4回目「まだ全然多い」。連打ペースに合わせ回転を速く）
  MAX_DYE: 1.0,               // 墨密度の上限。重ね打ちしても exp(-2.6)≈7% で和紙の質感が残る
  STROKE_INK_DIST: 0.035,     // なぞりで墨を注入する最小移動距離（テクスチャ座標）。
                              // pointermove は秒間60-120回発火するため、イベント毎注入だと
                              // 「量×頻度」で経路が即飽和する（2026-06-11 Ryo FB 2回目で判明）
  VELOCITY_DISSIPATION: 1.8,  // 流れの減衰。1.8: 流れが約0.5秒で収まり墨が「その場で」にじむ
                              // （0.55 だと墨が画面中に引き伸ばされ続け、細い線が保てない。
                              //   参考サイトの「静かな水面に細い筋」再現・2026-06-11 Ryo FB）
  PRESSURE: 0.8,
  PRESSURE_ITERATIONS: 20,
  CURL: 4,                    // 渦の強さ（羽毛状のエッジ）。8→4: 渦の自己増幅で線が崩壊するのを抑制
  SPLAT_RADIUS: 0.0045,
  SPLAT_FORCE: 5200,
  IDLE_MS: 12000,
};

// 墨の色は「吸収ベクトル」で持つ（紙の色 × exp(-dye) で減算混色）
const PAPER_RGB = [0.945, 0.922, 0.871];

/* ---- 設定（親パネルで変更・localStorage 永続化） ----
 * mode "vivid": 1歳児向け既定。乳児は低彩度色の知覚・選好が弱い（PMC7000485）ため、
 *               伝統色の色相を保ったまま彩度を引き上げた版。
 * mode "shibui": 従来の渋い伝統色（親が楽しむ用）。 */
const settings = Object.assign(
  { mode: "vivid", voice: false, lock: false, timerMin: 0, tilt: false },
  (() => { try { return JSON.parse(localStorage.getItem("sumi.settings") || "{}"); } catch (e) { return {}; } })()
);
function saveSettings() { try { localStorage.setItem("sumi.settings", JSON.stringify(settings)); } catch (e) {} }

// name は色名よみあげ（ひらがな）・timbre はタップ音色
const INK_SETS = {
  vivid: [
    { name: "あか",     a: [0.06, 1.05, 1.00], timbre: "taiko"   },  // 朱 → ビビッド朱赤
    { name: "あお",     a: [1.05, 0.50, 0.06], timbre: "chime"   },  // 藍 → コバルト
    { name: "きいろ",   a: [0.03, 0.14, 1.10], timbre: "marimba" },  // 山吹 → ビビッド黄
    { name: "みどり",   a: [0.95, 0.10, 0.90], timbre: "flute"   },  // 松葉 → 鮮緑
    { name: "だいだい", a: [0.05, 0.55, 1.05], timbre: "pluck"   },  // 橙
    { name: "むらさき", a: [0.60, 1.00, 0.22], timbre: "bell"    },  // 菖蒲 → 明るい紫
    // ⚠️ 黒（すみ）は入れない: 鮮色と混ざると濁って「汚く見える」（2026-06-11 Ryo FB）。
    //    墨はしぶいモード（伝統色）にのみ存在する
  ],
  shibui: [
    { name: "すみ",     a: [0.85, 0.83, 0.79], timbre: "deep"    },
    { name: "あお",     a: [0.80, 0.66, 0.40], timbre: "chime"   },  // 藍
    { name: "あか",     a: [0.26, 0.70, 0.74], timbre: "taiko"   },  // 朱
    { name: "みどり",   a: [0.68, 0.55, 0.64], timbre: "flute"   },  // 松葉
    { name: "きいろ",   a: [0.12, 0.30, 0.82], timbre: "marimba" },  // 山吹
    { name: "むらさき", a: [0.52, 0.76, 0.32], timbre: "bell"    },  // 菖蒲
  ],
};
function modeInks() { return INK_SETS[settings.mode] || INK_SETS.vivid; }

let selectedDef = null;  // null = おまかせ（にじいろ自動: 1滴ごとに色が変わる）
let autoIdx = 0;
function nextDef() { return selectedDef || modeInks()[autoIdx++ % modeInks().length]; }
/* ⚠️ 墨の注入量はRyo実機FB×3の調整済み領域（0.6→0.34→0.20→v4.0で×1.3ブーストして3回目の
 * 「多すぎ」correction）。scale 値そのものだけでなく「乗算係数・追加注入源・連続攪拌」も
 * 実効墨量を変える = この調整の実質上書きになる。新機能を足すときは増やさないこと。
 * vivid の鮮やかさは吸収ベクトルの色相純度で出ており、注入量を増やす必要はない。 */

/* ---------------- WebGL 初期化（WebGL2 → WebGL1 フォールバック） ---------------- */
function getWebGLContext(canvas) {
  const params = { alpha: false, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: false };
  let gl = canvas.getContext("webgl2", params);
  const isWebGL2 = !!gl;
  if (!isWebGL2) gl = canvas.getContext("webgl", params) || canvas.getContext("experimental-webgl", params);

  let halfFloat, supportLinearFiltering;
  if (isWebGL2) {
    gl.getExtension("EXT_color_buffer_float");
    supportLinearFiltering = true; // WebGL2 は half float の線形補間が core
  } else {
    halfFloat = gl.getExtension("OES_texture_half_float");
    supportLinearFiltering = !!gl.getExtension("OES_texture_half_float_linear");
  }
  gl.clearColor(0, 0, 0, 1);

  const halfFloatTexType = isWebGL2 ? gl.HALF_FLOAT : halfFloat.HALF_FLOAT_OES;
  let formatRGBA, formatRG, formatR;
  if (isWebGL2) {
    formatRGBA = getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, halfFloatTexType);
    formatRG = getSupportedFormat(gl, gl.RG16F, gl.RG, halfFloatTexType);
    formatR = getSupportedFormat(gl, gl.R16F, gl.RED, halfFloatTexType);
  } else {
    formatRGBA = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
    formatRG = formatRGBA;
    formatR = formatRGBA;
  }
  return { gl, ext: { formatRGBA, formatRG, formatR, halfFloatTexType, supportLinearFiltering } };
}

function getSupportedFormat(gl, internalFormat, format, type) {
  if (!supportRenderTextureFormat(gl, internalFormat, format, type)) {
    switch (internalFormat) {
      case gl.R16F: return getSupportedFormat(gl, gl.RG16F, gl.RG, type);
      case gl.RG16F: return getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, type);
      default: return null;
    }
  }
  return { internalFormat, format };
}

function supportRenderTextureFormat(gl, internalFormat, format, type) {
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, 4, 4, 0, format, type, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  return gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
}

const { gl, ext } = getWebGLContext(canvas);

/* ---------------- シェーダ ---------------- */
function compileShader(type, source, keywords) {
  if (keywords) source = keywords.map((k) => "#define " + k + "\n").join("") + source;
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

function createProgram(vs, fs) {
  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  const uniforms = {};
  const count = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < count; i++) {
    const name = gl.getActiveUniform(program, i).name;
    uniforms[name] = gl.getUniformLocation(program, name);
  }
  return { program, uniforms, bind() { gl.useProgram(program); } };
}

const baseVertexShader = compileShader(gl.VERTEX_SHADER, `
  precision highp float;
  attribute vec2 aPosition;
  varying vec2 vUv, vL, vR, vT, vB;
  uniform vec2 texelSize;
  void main () {
    vUv = aPosition * 0.5 + 0.5;
    vL = vUv - vec2(texelSize.x, 0.0);
    vR = vUv + vec2(texelSize.x, 0.0);
    vT = vUv + vec2(0.0, texelSize.y);
    vB = vUv - vec2(0.0, texelSize.y);
    gl_Position = vec4(aPosition, 0.0, 1.0);
  }
`);

const clearShader = compileShader(gl.FRAGMENT_SHADER, `
  precision mediump float;
  varying highp vec2 vUv;
  uniform sampler2D uTexture;
  uniform float value;
  void main () { gl_FragColor = value * texture2D(uTexture, vUv); }
`);

const splatShader = compileShader(gl.FRAGMENT_SHADER, `
  precision highp float;
  varying vec2 vUv;
  uniform sampler2D uTarget;
  uniform float aspectRatio;
  uniform vec3 color;
  uniform vec2 point;
  uniform float radius;
  uniform float clampMax;
  void main () {
    vec2 p = vUv - point.xy;
    p.x *= aspectRatio;
    vec3 splat = exp(-dot(p, p) / radius) * color;
    vec3 base = texture2D(uTarget, vUv).xyz;
    // 墨パスでは上限あり（重ね打ちで真っ黒に飽和しない）。速度パスは clampMax=1e6 で実質無効
    gl_FragColor = vec4(min(base + splat, vec3(clampMax)), 1.0);
  }
`);

const advectionShader = compileShader(gl.FRAGMENT_SHADER, `
  precision highp float;
  varying vec2 vUv;
  uniform sampler2D uVelocity;
  uniform sampler2D uSource;
  uniform vec2 texelSize;
  uniform vec2 dyeTexelSize;
  uniform float dt;
  uniform float dissipation;
  vec4 bilerp (sampler2D sam, vec2 uv, vec2 tsize) {
    vec2 st = uv / tsize - 0.5;
    vec2 iuv = floor(st);
    vec2 fuv = fract(st);
    vec4 a = texture2D(sam, (iuv + vec2(0.5, 0.5)) * tsize);
    vec4 b = texture2D(sam, (iuv + vec2(1.5, 0.5)) * tsize);
    vec4 c = texture2D(sam, (iuv + vec2(0.5, 1.5)) * tsize);
    vec4 d = texture2D(sam, (iuv + vec2(1.5, 1.5)) * tsize);
    return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);
  }
  void main () {
  #ifdef MANUAL_FILTERING
    vec2 coord = vUv - dt * bilerp(uVelocity, vUv, texelSize).xy * texelSize;
    vec4 result = bilerp(uSource, coord, dyeTexelSize);
  #else
    vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;
    vec4 result = texture2D(uSource, coord);
  #endif
    float decay = 1.0 + dissipation * dt;
    gl_FragColor = result / decay;
  }
`, ext.supportLinearFiltering ? null : ["MANUAL_FILTERING"]);

const divergenceShader = compileShader(gl.FRAGMENT_SHADER, `
  precision mediump float;
  varying highp vec2 vUv, vL, vR, vT, vB;
  uniform sampler2D uVelocity;
  void main () {
    float L = texture2D(uVelocity, vL).x;
    float R = texture2D(uVelocity, vR).x;
    float T = texture2D(uVelocity, vT).y;
    float B = texture2D(uVelocity, vB).y;
    vec2 C = texture2D(uVelocity, vUv).xy;
    if (vL.x < 0.0) { L = -C.x; }
    if (vR.x > 1.0) { R = -C.x; }
    if (vT.y > 1.0) { T = -C.y; }
    if (vB.y < 0.0) { B = -C.y; }
    gl_FragColor = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);
  }
`);

const curlShader = compileShader(gl.FRAGMENT_SHADER, `
  precision mediump float;
  varying highp vec2 vUv, vL, vR, vT, vB;
  uniform sampler2D uVelocity;
  void main () {
    float L = texture2D(uVelocity, vL).y;
    float R = texture2D(uVelocity, vR).y;
    float T = texture2D(uVelocity, vT).x;
    float B = texture2D(uVelocity, vB).x;
    float vorticity = R - L - T + B;
    gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);
  }
`);

const vorticityShader = compileShader(gl.FRAGMENT_SHADER, `
  precision highp float;
  varying vec2 vUv, vL, vR, vT, vB;
  uniform sampler2D uVelocity;
  uniform sampler2D uCurl;
  uniform float curl;
  uniform float dt;
  void main () {
    float L = texture2D(uCurl, vL).x;
    float R = texture2D(uCurl, vR).x;
    float T = texture2D(uCurl, vT).x;
    float B = texture2D(uCurl, vB).x;
    float C = texture2D(uCurl, vUv).x;
    vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
    force /= length(force) + 0.0001;
    force *= curl * C;
    force.y *= -1.0;
    vec2 velocity = texture2D(uVelocity, vUv).xy;
    velocity += force * dt;
    velocity = min(max(velocity, -1000.0), 1000.0);
    gl_FragColor = vec4(velocity, 0.0, 1.0);
  }
`);

const pressureShader = compileShader(gl.FRAGMENT_SHADER, `
  precision mediump float;
  varying highp vec2 vUv, vL, vR, vT, vB;
  uniform sampler2D uPressure;
  uniform sampler2D uDivergence;
  void main () {
    float L = texture2D(uPressure, vL).x;
    float R = texture2D(uPressure, vR).x;
    float T = texture2D(uPressure, vT).x;
    float B = texture2D(uPressure, vB).x;
    float divergence = texture2D(uDivergence, vUv).x;
    float pressure = (L + R + B + T - divergence) * 0.25;
    gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);
  }
`);

const gradientSubtractShader = compileShader(gl.FRAGMENT_SHADER, `
  precision mediump float;
  varying highp vec2 vUv, vL, vR, vT, vB;
  uniform sampler2D uPressure;
  uniform sampler2D uVelocity;
  void main () {
    float L = texture2D(uPressure, vL).x;
    float R = texture2D(uPressure, vR).x;
    float T = texture2D(uPressure, vT).x;
    float B = texture2D(uPressure, vB).x;
    vec2 velocity = texture2D(uVelocity, vUv).xy;
    velocity.xy -= vec2(R - L, T - B);
    gl_FragColor = vec4(velocity, 0.0, 1.0);
  }
`);

// 表示: 和紙テクスチャ × 墨の吸収（exp減衰）
const displayShader = compileShader(gl.FRAGMENT_SHADER, `
  precision highp float;
  varying vec2 vUv;
  uniform sampler2D uTexture;
  uniform vec2 resolution;
  uniform vec3 paper;
  uniform float mudCut;   // 濁り除去の強さ（はなやか 0.75 / しぶい 0.0）
  uniform float dispMax;  // 表示濃度の上限（黒を数学的に出力不能にする）
  float hash (vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
  float vnoise (vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
               mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
  }
  void main () {
    vec3 dye = texture2D(uTexture, vUv).rgb;
    // 綺麗さ優先の混色（2026-06-11 Ryo FB「どんどん黒くなって綺麗じゃない」）:
    // 減算混色は補色の重なりで構造的に黒を生む。全チャンネル共通の吸収（=濁り成分）を
    // 表示時に抜いて色相を保つ。シミュレーション自体は触らない（表示だけ綺麗化）
    float mud = min(dye.r, min(dye.g, dye.b));
    dye -= mudCut * mud;
    dye = min(dye, vec3(dispMax));
    vec2 px = vUv * resolution;
    // 和紙: 低周波の繊維ムラ + 高周波の粒子
    float fiber = vnoise(px * 0.012) * 0.45 + vnoise(px * 0.05) * 0.35 + vnoise(px * 0.22) * 0.20;
    float speck = hash(floor(px * 0.5));
    vec3 paperCol = paper * (0.965 + 0.055 * fiber + 0.012 * speck);
    // 墨のにじみ: 吸収モデル（濃い所は深く、薄い所は羽毛状に）
    vec3 col = paperCol * exp(-dye * 2.6);
    gl_FragColor = vec4(col, 1.0);
  }
`);

/* ---------------- フレームバッファ ---------------- */
const blit = (() => {
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
  const elem = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, elem);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.enableVertexAttribArray(0);
  return (target) => {
    if (target == null) {
      gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } else {
      gl.viewport(0, 0, target.width, target.height);
      gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    }
    gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
  };
})();

function createFBO(w, h, internalFormat, format, type, filter) {
  const texture = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, type, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  gl.viewport(0, 0, w, h);
  gl.clear(gl.COLOR_BUFFER_BIT);
  return {
    texture, fbo, width: w, height: h,
    texelSizeX: 1 / w, texelSizeY: 1 / h,
    attach(id) {
      gl.activeTexture(gl.TEXTURE0 + id);
      gl.bindTexture(gl.TEXTURE_2D, texture);
      return id;
    },
  };
}

function createDoubleFBO(w, h, internalFormat, format, type, filter) {
  let fbo1 = createFBO(w, h, internalFormat, format, type, filter);
  let fbo2 = createFBO(w, h, internalFormat, format, type, filter);
  return {
    width: w, height: h,
    texelSizeX: fbo1.texelSizeX, texelSizeY: fbo1.texelSizeY,
    get read() { return fbo1; },
    get write() { return fbo2; },
    swap() { const t = fbo1; fbo1 = fbo2; fbo2 = t; },
  };
}

function getResolution(resolution) {
  let aspect = gl.drawingBufferWidth / gl.drawingBufferHeight;
  if (aspect < 1) aspect = 1 / aspect;
  const min = Math.round(resolution);
  const max = Math.round(resolution * aspect);
  return gl.drawingBufferWidth > gl.drawingBufferHeight ? { width: max, height: min } : { width: min, height: max };
}

let dye, velocity, divergence, curl, pressure;
function releaseDoubleFBO(d) {
  [d.read, d.write].forEach((f) => { gl.deleteTexture(f.texture); gl.deleteFramebuffer(f.fbo); });
}
// preserve=true: 既存の墨・流れを新バッファへコピーして引き継ぐ。
// 回転・PWAのUIバー変化・headless初回フレームのリサイズで「描いた絵が全消去」される
// バグの修正（2026-06-11 発見: 初回フレームの reinit がシード墨を消していた）
function initFramebuffers(preserve) {
  const oldDye = preserve ? dye : null;
  const oldVel = preserve ? velocity : null;
  const simRes = getResolution(config.SIM_RESOLUTION);
  const dyeRes = getResolution(config.DYE_RESOLUTION);
  const texType = ext.halfFloatTexType;
  const rgba = ext.formatRGBA, rg = ext.formatRG, r = ext.formatR;
  const filtering = ext.supportLinearFiltering ? gl.LINEAR : gl.NEAREST;
  gl.disable(gl.BLEND);
  dye = createDoubleFBO(dyeRes.width, dyeRes.height, rgba.internalFormat, rgba.format, texType, filtering);
  velocity = createDoubleFBO(simRes.width, simRes.height, rg.internalFormat, rg.format, texType, filtering);
  divergence = createFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);
  curl = createFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);
  pressure = createDoubleFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);
  if (oldDye) {
    copyFBO(oldDye.read, dye.write); dye.swap();
    copyFBO(oldVel.read, velocity.write); velocity.swap();
    releaseDoubleFBO(oldDye); releaseDoubleFBO(oldVel);
  }
}
// clearShader (value * texture) を value=1.0 で使うと「旧テクスチャ→新FBOの全面コピー」になる
function copyFBO(srcFBO, dstFBO) {
  programs.clear.bind();
  gl.uniform1i(programs.clear.uniforms.uTexture, srcFBO.attach(0));
  gl.uniform1f(programs.clear.uniforms.value, 1.0);
  blit(dstFBO);
}

const programs = {
  clear: createProgram(baseVertexShader, clearShader),
  splat: createProgram(baseVertexShader, splatShader),
  advection: createProgram(baseVertexShader, advectionShader),
  divergence: createProgram(baseVertexShader, divergenceShader),
  curl: createProgram(baseVertexShader, curlShader),
  vorticity: createProgram(baseVertexShader, vorticityShader),
  pressure: createProgram(baseVertexShader, pressureShader),
  gradientSubtract: createProgram(baseVertexShader, gradientSubtractShader),
  display: createProgram(baseVertexShader, displayShader),
};

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(innerWidth * dpr);
  const h = Math.round(innerHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    return true;
  }
  return false;
}
resizeCanvas();
initFramebuffers();

/* ---------------- シミュレーションステップ ---------------- */
let densityDissipation = config.DENSITY_DISSIPATION; // 洗い流し中は一時的に上げる

function step(dt) {
  gl.disable(gl.BLEND);

  programs.curl.bind();
  gl.uniform2f(programs.curl.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(programs.curl.uniforms.uVelocity, velocity.read.attach(0));
  blit(curl);

  programs.vorticity.bind();
  gl.uniform2f(programs.vorticity.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(programs.vorticity.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1i(programs.vorticity.uniforms.uCurl, curl.attach(1));
  gl.uniform1f(programs.vorticity.uniforms.curl, config.CURL);
  gl.uniform1f(programs.vorticity.uniforms.dt, dt);
  blit(velocity.write);
  velocity.swap();

  programs.divergence.bind();
  gl.uniform2f(programs.divergence.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(programs.divergence.uniforms.uVelocity, velocity.read.attach(0));
  blit(divergence);

  programs.clear.bind();
  gl.uniform1i(programs.clear.uniforms.uTexture, pressure.read.attach(0));
  gl.uniform1f(programs.clear.uniforms.value, config.PRESSURE);
  blit(pressure.write);
  pressure.swap();

  programs.pressure.bind();
  gl.uniform2f(programs.pressure.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(programs.pressure.uniforms.uDivergence, divergence.attach(0));
  for (let i = 0; i < config.PRESSURE_ITERATIONS; i++) {
    gl.uniform1i(programs.pressure.uniforms.uPressure, pressure.read.attach(1));
    blit(pressure.write);
    pressure.swap();
  }

  programs.gradientSubtract.bind();
  gl.uniform2f(programs.gradientSubtract.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(programs.gradientSubtract.uniforms.uPressure, pressure.read.attach(0));
  gl.uniform1i(programs.gradientSubtract.uniforms.uVelocity, velocity.read.attach(1));
  blit(velocity.write);
  velocity.swap();

  programs.advection.bind();
  gl.uniform2f(programs.advection.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  if (!ext.supportLinearFiltering)
    gl.uniform2f(programs.advection.uniforms.dyeTexelSize, velocity.texelSizeX, velocity.texelSizeY);
  const velocityId = velocity.read.attach(0);
  gl.uniform1i(programs.advection.uniforms.uVelocity, velocityId);
  gl.uniform1i(programs.advection.uniforms.uSource, velocityId);
  gl.uniform1f(programs.advection.uniforms.dt, dt);
  gl.uniform1f(programs.advection.uniforms.dissipation, config.VELOCITY_DISSIPATION);
  blit(velocity.write);
  velocity.swap();

  if (!ext.supportLinearFiltering)
    gl.uniform2f(programs.advection.uniforms.dyeTexelSize, dye.texelSizeX, dye.texelSizeY);
  gl.uniform1i(programs.advection.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1i(programs.advection.uniforms.uSource, dye.read.attach(1));
  gl.uniform1f(programs.advection.uniforms.dissipation, densityDissipation);
  blit(dye.write);
  dye.swap();
}

function render() {
  programs.display.bind();
  gl.uniform1i(programs.display.uniforms.uTexture, dye.read.attach(0));
  gl.uniform2f(programs.display.uniforms.resolution, gl.drawingBufferWidth, gl.drawingBufferHeight);
  gl.uniform3f(programs.display.uniforms.paper, PAPER_RGB[0], PAPER_RGB[1], PAPER_RGB[2]);
  // しぶいモードは墨（ほぼ無彩色）が主役なので濁り除去をかけない（かけると墨が消える）
  gl.uniform1f(programs.display.uniforms.mudCut, settings.mode === "vivid" ? 0.75 : 0.0);
  gl.uniform1f(programs.display.uniforms.dispMax, 0.55);
  blit(null);
}

/* ---------------- スプラット（墨・速度の注入） ---------------- */
function correctRadius(radius) {
  const aspect = canvas.width / canvas.height;
  if (aspect > 1) radius *= aspect;
  return radius;
}

function splat(x, y, dx, dy, color, radiusScale) {
  programs.splat.bind();
  gl.uniform1i(programs.splat.uniforms.uTarget, velocity.read.attach(0));
  gl.uniform1f(programs.splat.uniforms.aspectRatio, canvas.width / canvas.height);
  gl.uniform2f(programs.splat.uniforms.point, x, y);
  gl.uniform3f(programs.splat.uniforms.color, dx, dy, 0);
  gl.uniform1f(programs.splat.uniforms.radius, correctRadius(config.SPLAT_RADIUS * (radiusScale || 1)));
  gl.uniform1f(programs.splat.uniforms.clampMax, 1e6);  // 速度は無制限
  blit(velocity.write);
  velocity.swap();

  gl.uniform1i(programs.splat.uniforms.uTarget, dye.read.attach(0));
  gl.uniform3f(programs.splat.uniforms.color, color[0], color[1], color[2]);
  gl.uniform1f(programs.splat.uniforms.clampMax, config.MAX_DYE);  // 墨は上限あり
  blit(dye.write);
  dye.swap();
}

function splatVelocityOnly(x, y, dx, dy, radiusScale) {
  programs.splat.bind();
  gl.uniform1i(programs.splat.uniforms.uTarget, velocity.read.attach(0));
  gl.uniform1f(programs.splat.uniforms.aspectRatio, canvas.width / canvas.height);
  gl.uniform2f(programs.splat.uniforms.point, x, y);
  gl.uniform3f(programs.splat.uniforms.color, dx, dy, 0);
  gl.uniform1f(programs.splat.uniforms.radius, correctRadius(config.SPLAT_RADIUS * (radiusScale || 1)));
  gl.uniform1f(programs.splat.uniforms.clampMax, 1e6);
  blit(velocity.write);
  velocity.swap();
}

// タッチ位置 → テクスチャ座標
function texCoord(clientX, clientY) {
  return [clientX / innerWidth, 1 - clientY / innerHeight];
}

// 墨滴: 中心に墨 + 外向きの弱い流れ + 接線のうねり（タップだけで模様が動く）
// opt: { def, scale, radius, ringScale } — 手のひらペタンは大きめで呼ぶ
let dropSwirl = 1;  // うねりの回転方向を1滴ごとに反転（模様が単調にならない）
function inkDrop(clientX, clientY, big, opt) {
  opt = opt || {};
  const def = opt.def || nextDef();
  const [x, y] = texCoord(clientX, clientY);
  // Ryo実機FB 2026-06-11 ×2「まだ多い・長く遊べるように」: 0.6→0.34→0.20。
  // 1滴は薄めに出る → にじみ広がりで存在感が出る。連打の黒化は MAX_DYE クランプが防ぐ
  // 注入量 0.12/0.07: Ryo FB 4回目（2026-06-11「まだ全然墨の量が多い」）。0.20 からさらに削減。
  // ⚠️ これ以上増やす変更（係数・追加注入源含む）は禁止。inkBudgetCheck が回帰検知する
  const s = opt.scale != null ? opt.scale : (big ? 0.12 : 0.07);
  const ink = [def.a[0] * s, def.a[1] * s, def.a[2] * s];
  // 滴半径 3.0/1.8（旧 4.5/2.5）: 参考サイトの繊細さに合わせて小ぶりに（2026-06-11 Ryo FB「細く」）
  splat(x, y, 0, 0, ink, opt.radius != null ? opt.radius : (big ? 3.0 : 1.8));
  // 半径方向は弱く（強くすると墨が霧散して消える・2026-06-11 プローブで実証）、
  // 接線方向の回転をごく弱く足してタップだけで「うねり」が生まれるようにする
  // （v4.0 の 0.016 は攪拌過多 → 半減・2026-06-11 Ryo FB「多すぎて何が何だか」）
  dropSwirl = -dropSwirl;
  const n = 6;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + Math.random();
    const r = 0.008;
    const rad = config.SPLAT_FORCE * 0.012;
    const tan = config.SPLAT_FORCE * 0.008 * dropSwirl;
    splatVelocityOnly(
      x + Math.cos(a) * r, y + Math.sin(a) * r,
      Math.cos(a) * rad - Math.sin(a) * tan,
      Math.sin(a) * rad + Math.cos(a) * tan,
      1.2
    );
  }
  // 即時フィードバック: 波紋リング（にじみはゆっくりなので、反応の即時性はここで担保）
  if (typeof fx !== "undefined") fx.ring(clientX, clientY, swatchCSS(def.a), opt.ringScale || (big ? 1 : 0.6));
  return def;
}

// なぞり: 移動方向に流れ（毎イベント・操作感の維持）+ 墨は移動距離ベースで間引いて注入
let strokeDistAcc = 0;  // 前回の墨注入からの累積移動距離（テクスチャ座標）
function inkStroke(clientX, clientY, dxPx, dyPx) {
  const [x, y] = texCoord(clientX, clientY);
  // 速すぎるスワイプでも墨が吹き飛ばないよう流速をクランプ。
  // 力 0.5倍・クランプ60・半径0.35: なぞりの速度場が太い川（線幅6.7%）になると
  // 周囲の墨を帯状に引きずり「細い筋」が保てない（2026-06-11 vis 検証で実証）
  const clamp = (v) => Math.max(-60, Math.min(60, v));
  const dx = clamp((dxPx / innerWidth) * config.SPLAT_FORCE * 0.5);
  const dy = clamp((-dyPx / innerHeight) * config.SPLAT_FORCE * 0.5);
  // 流れはイベント毎に注入（既にある墨を「動かす」のは無料 = 黒くならない）
  splatVelocityOnly(x, y, dx, dy, 0.35);
  // 墨は距離スロットリング。イベント毎だと量×頻度（60-120Hz）で経路が即飽和する
  strokeDistAcc += Math.hypot(dxPx / innerWidth, dyPx / innerHeight);
  if (strokeDistAcc >= config.STROKE_INK_DIST) {
    strokeDistAcc = 0;
    // 細線化（2026-06-11 Ryo FB「参考サイトみたいに細く」）: 半径 0.9→0.40・振幅 0.14。
    // ⚠️ 細い gaussian は水が荒いと数値拡散で消える（旧 VEL_DISS 0.55 + CURL 8 時代に
    //    radius 0.35 が1秒で消滅した実測あり）。水を静めた（VEL_DISS 1.8 / CURL 4 /
    //    なぞり速度場 0.35）うえで細くするのがセット。dye-stroke プローブが残存を監視
    const ink = nextInkSameColor(0.10);  // 0.14→0.10（Ryo FB 4回目「まだ全然多い」）
    splat(x, y, dx, dy, ink, 0.40);
    // なぞりが旋律になる: Y位置の音高でごく小さく鳴らす（主張しすぎない音量）
    tone(pentaFreq(pitchFromY(clientY)), { type: "sine", decay: 0.18, gain: 0.028 });
  }
}

// なぞり中は色を切り替えない（1ストローク1色）
let strokeInk = null;
function nextInkSameColor(scale) {
  if (!strokeInk) strokeInk = nextDef().a;
  return [strokeInk[0] * scale, strokeInk[1] * scale, strokeInk[2] * scale];
}

/* ---------------- やさしい効果音 ----------------
 * 設計（2026-06-11 ベストプラクティス調査反映）:
 *  - Y位置 → ペンタトニック音高（上ほど高い・Sago Mini Sound Box の音階ゾーン方式）
 *  - 色ごとに音色（taiko/chime/marimba…・Baby's Musical Hands のゾーン理論を色に転用)
 *  - 連打アルペジオ: 連続タップで音が上昇 = 連打を抑制せず「演奏」として報酬化
 *  - 水音レイヤー: ノイズ→バンドパス降下の合成水音を薄く重ねる（Pok Pok 手録り音の方向性）
 */
let audio = null;
let noiseBuf = null;
let muted = false;  // おやすみタイマー満了中は鳴らさない
const PENTA = [523.25, 587.33, 659.25, 783.99, 880.0];  // C5 D5 E5 G5 A5

function ac() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if (audio.state === "suspended") audio.resume();
  return audio;
}
// 0..9 → 2オクターブのペンタトニック（下: C4..A4 / 上: C5..A5）
function pentaFreq(idx) {
  idx = Math.max(0, Math.min(9, Math.round(idx)));
  return PENTA[idx % 5] * (idx < 5 ? 0.5 : 1);
}
function pitchFromY(clientY) {
  return Math.round((1 - clientY / innerHeight) * 9);
}

function tone(freq, opt) {
  if (muted) return;
  opt = opt || {};
  try {
    const ctx = ac(), t0 = ctx.currentTime;
    const attack = opt.attack || 0.012, decay = opt.decay || 0.4, gain = opt.gain || 0.08;
    const out = ctx.createGain();
    out.gain.setValueAtTime(0.001, t0);
    out.gain.exponentialRampToValueAtTime(gain, t0 + attack);
    out.gain.exponentialRampToValueAtTime(0.001, t0 + attack + decay);
    if (opt.lp) {
      const f = ctx.createBiquadFilter();
      f.type = "lowpass"; f.frequency.value = opt.lp;
      out.connect(f); f.connect(ctx.destination);
    } else {
      out.connect(ctx.destination);
    }
    const osc = ctx.createOscillator();
    osc.type = opt.type || "sine";
    if (opt.slideFrom) {
      osc.frequency.setValueAtTime(opt.slideFrom, t0);
      osc.frequency.exponentialRampToValueAtTime(freq, t0 + 0.08);
    } else {
      osc.frequency.setValueAtTime(freq, t0);
    }
    osc.connect(out);
    osc.start(t0); osc.stop(t0 + attack + decay + 0.05);
    if (opt.partial) {  // 倍音を1本足して楽器らしさを出す
      const o2 = ctx.createOscillator(), g2 = ctx.createGain();
      o2.type = "sine";
      o2.frequency.setValueAtTime(freq * (opt.partialRatio || 2), t0);
      g2.gain.setValueAtTime(0.001, t0);
      g2.gain.exponentialRampToValueAtTime(gain * opt.partial, t0 + attack);
      g2.gain.exponentialRampToValueAtTime(0.001, t0 + attack + decay * 0.6);
      o2.connect(g2).connect(ctx.destination);
      o2.start(t0); o2.stop(t0 + decay);
    }
  } catch (e) { /* 音が出なくても遊べる */ }
}

// 合成の水音（ぽちゃ）: ホワイトノイズ→バンドパス周波数降下
function splashNoise(big) {
  if (muted) return;
  try {
    const ctx = ac(), t0 = ctx.currentTime;
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.5), ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass"; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(big ? 520 : 900, t0);
    bp.frequency.exponentialRampToValueAtTime(big ? 180 : 350, t0 + 0.22);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.001, t0);
    g.gain.exponentialRampToValueAtTime(big ? 0.07 : 0.032, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + (big ? 0.4 : 0.25));
    src.connect(bp); bp.connect(g); g.connect(ctx.destination);
    src.start(t0); src.stop(t0 + 0.5);
  } catch (e) {}
}

// 色 → 音色
const TIMBRES = {
  taiko:   (f) => tone(Math.max(110, f * 0.25), { decay: 0.35, gain: 0.12, slideFrom: Math.max(150, f * 0.35) }),
  chime:   (f) => { tone(f, { decay: 0.9, gain: 0.07 }); tone(f * 2.01, { decay: 0.7, gain: 0.022 }); },
  marimba: (f) => tone(f, { decay: 0.3, gain: 0.10, partial: 0.4, partialRatio: 4 }),
  flute:   (f) => tone(f, { type: "triangle", attack: 0.05, decay: 0.5, gain: 0.07, lp: 2200 }),
  pluck:   (f) => tone(f, { type: "sawtooth", decay: 0.28, gain: 0.045, lp: 1800 }),
  bell:    (f) => tone(f, { decay: 0.8, gain: 0.07, partial: 0.5, partialRatio: 2.76 }),
  deep:    (f) => tone(f * 0.5, { decay: 0.45, gain: 0.09, slideFrom: f * 0.7 }),
};

// 連打アルペジオの状態（pointerdown で更新）
let combo = 0, lastTapTime = 0;

function dropSound(def, clientY, palm) {
  if (palm) {  // 手のひらペタン: 低い「ぼちゃん」
    TIMBRES.deep(pentaFreq(1));
    splashNoise(true);
    return;
  }
  const idx = pitchFromY(clientY) + Math.min(combo, 4);  // 連打で上昇
  (TIMBRES[def.timbre] || TIMBRES.deep)(pentaFreq(idx));
  splashNoise(false);
}

// UIボタン用の従来 plip（ランダムなペンタトニック1音）
function plip() {
  tone(PENTA[Math.floor(Math.random() * PENTA.length)] * (Math.random() < 0.3 ? 0.5 : 1) * 1.0,
       { decay: 0.45, gain: 0.09, slideFrom: 700 });
}

/* ---------------- 色名よみあげ（親パネルでON・コビューイング支援） ---------------- */
let lastVoiceAt = 0;
function sayColor(name) {
  if (!settings.voice || muted) return;
  const now = Date.now();
  if (now - lastVoiceAt < 1600) return;  // 連打で声が渋滞しないようスロットリング
  lastVoiceAt = now;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(name);
    u.lang = "ja-JP"; u.rate = 0.8; u.pitch = 1.3; u.volume = 0.9;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------------- 入力（マルチタッチ対応） ---------------- */
const pointers = new Map();
let lastTouchAt = Date.now();
let washFramesLeft = 0;
let washTimer = null;
let panelTimer = null;  // 4本指1.5秒ホールド → 親パネル（こどもロック中の唯一の入口）

// ときどきサプライズ: 10〜15タップに1回、桜吹雪 or 金魚ジャンプ（隠し発見 = emergent reward）
let tapsUntilSurprise = 10 + Math.floor(Math.random() * 6);
function countSurprise() {
  if (--tapsUntilSurprise > 0) return;
  tapsUntilSurprise = 10 + Math.floor(Math.random() * 6);
  if (Math.random() < 0.55) fx.sakura(); else fx.fishJump();
}

canvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (bedtime) return;
  lastTouchAt = Date.now();
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  strokeInk = null;
  // 連打アルペジオ: 700ms 以内の連続タップで音が上がっていく
  const now = performance.now();
  combo = now - lastTapTime < 700 ? combo + 1 : 0;
  lastTapTime = now;
  // 手のひらペタン検出: 接触楕円が指よりずっと大きい → 特大の滴 + 低い「ぼちゃん」
  const palm = (e.width || 0) >= 36;
  const def = inkDrop(e.clientX, e.clientY, true,
                      palm ? { scale: 0.18, radius: 7, ringScale: 1.7 } : null);
  dropSound(def, e.clientY, palm);
  sayColor(def.name);
  fx.fishTarget(e.clientX, e.clientY);
  countSurprise();
  if (pointers.size === 3) {
    washTimer = setTimeout(() => { if (pointers.size === 3) washFramesLeft = 110; }, 1200);
  } else if (pointers.size === 4) {
    if (washTimer) { clearTimeout(washTimer); washTimer = null; }
    panelTimer = setTimeout(() => { if (pointers.size === 4) openPanel(); }, 1500);
  } else if (washTimer) {
    clearTimeout(washTimer); washTimer = null;
  }
});

canvas.addEventListener("pointermove", (e) => {
  const pt = pointers.get(e.pointerId);
  if (!pt) return;
  e.preventDefault();
  if (bedtime) return;
  lastTouchAt = Date.now();
  const dx = e.clientX - pt.x, dy = e.clientY - pt.y;
  if (dx * dx + dy * dy < 2) return;
  inkStroke(e.clientX, e.clientY, dx, dy);
  fx.fishTarget(e.clientX, e.clientY);  // 金魚はなぞっている指も追いかける
  pt.x = e.clientX; pt.y = e.clientY;
});

function release(e) {
  pointers.delete(e.pointerId);
  strokeInk = null;
  strokeDistAcc = 0;
  if (washTimer && pointers.size !== 3) { clearTimeout(washTimer); washTimer = null; }
  if (panelTimer && pointers.size !== 4) { clearTimeout(panelTimer); panelTimer = null; }
}
canvas.addEventListener("pointerup", release);
canvas.addEventListener("pointercancel", release);

document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

/* ---------------- 色パレット & ながすボタン ---------------- */
// スウォッチの表示色は実際のにじみと同じ吸収モデルで計算（見た目と描画色のズレを防ぐ）
function swatchCSS(a) {
  const rgb = PAPER_RGB.map((p, i) => Math.round(p * Math.exp(-a[i] * 2.2) * 255));
  return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
}
const paletteEl = document.getElementById("palette");
const palBtn = document.getElementById("palBtn");
function buildPalette() {
  paletteEl.innerHTML = "";
  const defs = [{ name: "おまかせ", a: null }].concat(modeInks());
  defs.forEach((def) => {
    const b = document.createElement("button");
    const isSel = def.a === null ? selectedDef === null : selectedDef === def;
    b.className = "sw" + (isSel ? " sel" : "");
    b.setAttribute("aria-label", def.name);
    if (def.a) {
      b.style.background = swatchCSS(def.a);
    } else {
      // おまかせ: 現モードの固定色たちの円環グラデーション
      const stops = modeInks().map((d, j, arr) =>
        `${swatchCSS(d.a)} ${Math.round((j / arr.length) * 360)}deg`).join(", ");
      b.style.background = `conic-gradient(${stops})`;
    }
    b.addEventListener("pointerdown", (e) => {
      e.preventDefault(); e.stopPropagation();
      lastTouchAt = Date.now();          // パレット操作中に自動演出を始めない
      selectedDef = def.a ? def : null;
      strokeInk = null;
      paletteEl.querySelectorAll(".sw").forEach((el) => el.classList.remove("sel"));
      b.classList.add("sel");
      plip();
      if (def.a) sayColor(def.name);
      paletteEl.classList.remove("open");  // 選んだら自動で閉じてキャンバスに戻す
      // 選んだ色がすぐ見える: 画面中央やや上に小さな墨滴を落とす（アイコン撮影では出さない）
      if (!(typeof iconMode !== "undefined" && iconMode))
        inkDrop(innerWidth / 2, innerHeight * 0.4, false, def.a ? { def } : null);
    });
    paletteEl.appendChild(b);
  });
}
buildPalette();

// 🎨: タップでパレット開閉 / 2.5秒長押しで親パネル（おうちのかたメニュー）
let palHoldTimer = null;
palBtn.addEventListener("pointerdown", (e) => {
  e.preventDefault(); e.stopPropagation();
  lastTouchAt = Date.now();
  paletteEl.classList.toggle("open");
  plip();
  palHoldTimer = setTimeout(() => {
    paletteEl.classList.remove("open");
    openPanel();
  }, 2500);
});
["pointerup", "pointercancel", "pointerleave"].forEach((ev) =>
  palBtn.addEventListener(ev, () => { if (palHoldTimer) { clearTimeout(palHoldTimer); palHoldTimer = null; } }));

const washBtn = document.getElementById("washBtn");
washBtn.addEventListener("pointerdown", (e) => {
  e.preventDefault(); e.stopPropagation();
  lastTouchAt = Date.now();
  paletteEl.classList.remove("open");
  washFramesLeft = 110;                // 3本指ホールドと同じ「洗い流し」演出
  plip();
});

// キャンバスで遊び始めたらパレットは引っ込める
canvas.addEventListener("pointerdown", () => paletteEl.classList.remove("open"));

/* ============================================================
 * FXオーバーレイ（2D canvas・タッチ透過）
 *   - 波紋リング: タップへの<100ms即時フィードバック（にじみはゆっくりでOKになる）
 *   - 金魚2匹: 指を追って泳ぐ・流体に引き波を残す（墨が魚のあとでうねる）
 *   - 桜吹雪: サプライズ演出。着水で小さな桜色のにじみ
 * ============================================================ */
const fx = (() => {
  const cv = document.getElementById("fx");
  const ctx2 = cv.getContext("2d");
  let DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.round(innerWidth * DPR), h = Math.round(innerHeight * DPR);
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  }
  resize();

  const rings = [], petals = [], fishes = [];

  function ring(px, py, color, scale) {
    // ?demo（headless検証）ではリングを出さない: 同期シードの数十発が一斉に写り込み
    // 墨の視覚検証（細さ・色）を覆い隠すため。実機プレイには影響しない
    if (typeof demoMode !== "undefined" && demoMode) return;
    if (typeof iconMode !== "undefined" && iconMode) return;  // アイコン撮影では波紋を出さない
    rings.push({ x: px, y: py, max: 80 * (scale || 1), color, t: 0 });
  }

  /* ---- 金魚（1匹だけ・視覚要素を絞る。2歳未満は1画面1〜2要素が上限 / 2026-06-11 Ryo FB） ---- */
  fishes.push({
    x: innerWidth * 0.35, y: innerHeight * 0.4,
    vx: 25, vy: 8, angle: 0, phase: Math.random() * 6,
    hue: "#e8633a", hue2: "#f2a98c", spot: false,   // 緋鯉
    wanderX: innerWidth * 0.5, wanderY: innerHeight * 0.5, wanderAt: 0,
    jump: 0,
  });
  let touchX = null, touchY = null, touchAt = -1e9;
  function fishTarget(px, py) { touchX = px; touchY = py; touchAt = performance.now(); }
  function fishJump() {
    const f = fishes[Math.floor(Math.random() * fishes.length)];
    if (f && f.jump === 0) f.jump = 0.0001;
  }

  function stepFish(f, dt, now) {
    if (f.jump > 0) {  // ジャンプ演出（0→1で放物線・着水で波紋と水音）
      f.jump += dt / 0.9;
      f.x += f.vx * dt * 0.4; f.y += f.vy * dt * 0.4;
      if (f.jump >= 1) {
        f.jump = 0;
        ring(f.x, f.y, "rgba(110,130,150,0.9)", 1.5);
        splashNoise(true);
        const [u, v] = texCoord(f.x, f.y);
        splat(u, v, 0, 0, [0.08, 0.04, 0.01], 3.0);  // 着水の薄い水色の水紋（無彩色は濁り除去で消えるため色相を持たせる）
      }
      return;
    }
    const chasing = now - touchAt < 4000;
    let tx, ty, speed;
    if (chasing) { tx = touchX; ty = touchY; speed = 230; }
    else {
      if (now > f.wanderAt) {
        f.wanderX = innerWidth * (0.1 + Math.random() * 0.8);
        f.wanderY = innerHeight * (0.1 + Math.random() * 0.8);
        f.wanderAt = now + 2500 + Math.random() * 3000;
      }
      tx = f.wanderX; ty = f.wanderY; speed = 60;
    }
    let dx = tx - f.x, dy = ty - f.y;
    if (chasing && Math.hypot(dx, dy) < 75) {  // 指に着いたら周りをくるくる旋回
      const orbit = now * 0.0018 + f.phase;
      dx = tx + Math.cos(orbit) * 55 - f.x;
      dy = ty + Math.sin(orbit) * 55 - f.y;
    }
    const d = Math.hypot(dx, dy) || 1;
    const steer = chasing ? 3.0 : 1.1;
    f.vx += ((dx / d) * speed - f.vx) * Math.min(1, steer * dt);
    f.vy += ((dy / d) * speed - f.vy) * Math.min(1, steer * dt);
    const m = 30;  // 画面端よけ
    if (f.x < m) f.vx += 140 * dt;
    if (f.x > innerWidth - m) f.vx -= 140 * dt;
    if (f.y < m) f.vy += 140 * dt;
    if (f.y > innerHeight - m) f.vy -= 140 * dt;
    f.x += f.vx * dt; f.y += f.vy * dt;
    const targetAngle = Math.atan2(f.vy, f.vx);
    let da = targetAngle - f.angle;
    while (da > Math.PI) da -= Math.PI * 2;
    while (da < -Math.PI) da += Math.PI * 2;
    f.angle += da * Math.min(1, 6 * dt);
    // ⚠️ 引き波（泳ぎを流体へ常時注入）は実装しない: 連続攪拌で墨が定着せず
    // 画面全体が混ざって判別不能になる（2026-06-11 Ryo FB「多すぎて何が何だか」）。
    // 流体に触れるのはジャンプ着水の一瞬だけ。
  }

  function drawFish(f, now) {
    let jy = 0, scale = 1;
    if (f.jump > 0) {
      jy = -Math.sin(f.jump * Math.PI) * 90;
      scale = 1 + Math.sin(f.jump * Math.PI) * 0.35;
    }
    if (typeof iconMode !== "undefined" && iconMode) scale *= ICON_FISH_SCALE;
    ctx2.save();
    ctx2.translate(f.x * DPR, (f.y + jy) * DPR);
    ctx2.rotate(f.angle);
    ctx2.scale(scale * DPR, scale * DPR);
    ctx2.globalAlpha = iconMode ? 0.95 : 0.82;
    const wag = Math.sin(now * 0.012 + f.phase) * 0.45;
    ctx2.fillStyle = f.hue;
    ctx2.beginPath();  // ひらひらの尾
    ctx2.moveTo(-13, 0);
    ctx2.quadraticCurveTo(-30, -10 + wag * 14, -36, -6 + wag * 16);
    ctx2.quadraticCurveTo(-26, wag * 6, -36, 8 + wag * 16);
    ctx2.quadraticCurveTo(-30, 10 + wag * 14, -13, 0);
    ctx2.fill();
    const grad = ctx2.createLinearGradient(-16, 0, 20, 0);  // 胴体
    grad.addColorStop(0, f.hue);
    grad.addColorStop(1, f.hue2);
    ctx2.fillStyle = grad;
    ctx2.beginPath();
    ctx2.ellipse(0, 0, 19, 8.5, 0, 0, Math.PI * 2);
    ctx2.fill();
    if (f.spot) {  // 白鯉の緋斑
      ctx2.fillStyle = "#e8633a";
      ctx2.beginPath(); ctx2.ellipse(4, -2, 6, 4, 0.4, 0, Math.PI * 2); ctx2.fill();
    }
    ctx2.globalAlpha = 0.55;  // 胸びれ
    ctx2.fillStyle = f.hue;
    ctx2.beginPath(); ctx2.ellipse(2, -9, 6, 2.6, -0.7 + wag * 0.3, 0, Math.PI * 2); ctx2.fill();
    ctx2.beginPath(); ctx2.ellipse(2, 9, 6, 2.6, 0.7 - wag * 0.3, 0, Math.PI * 2); ctx2.fill();
    ctx2.globalAlpha = 0.85;  // 目（上から見た姿なので両側）
    ctx2.fillStyle = "#3a3430";
    ctx2.beginPath(); ctx2.arc(13, -3.2, 1.7, 0, Math.PI * 2); ctx2.fill();
    ctx2.beginPath(); ctx2.arc(13, 3.2, 1.7, 0, Math.PI * 2); ctx2.fill();
    ctx2.restore();
  }

  /* ---- 桜吹雪 ---- */
  function sakura() {
    const n = 4 + Math.floor(Math.random() * 3);  // 4〜6枚（多いと視覚ノイズ）
    for (let i = 0; i < n; i++) {
      petals.push({
        x: Math.random() * innerWidth, y: -20 - Math.random() * 140,
        vy: 35 + Math.random() * 30,
        sway: Math.random() * 6, swayAmp: 18 + Math.random() * 22,
        rot: Math.random() * 6, vrot: (Math.random() - 0.5) * 2,
        landY: innerHeight * (0.3 + Math.random() * 0.55), landed: 0, life: 1,
      });
    }
  }

  function stepPetal(p, dt) {
    if (!p.landed) {
      p.y += p.vy * dt;
      p.sway += dt * 2.2;
      p.x += Math.cos(p.sway) * p.swayAmp * dt;
      p.rot += p.vrot * dt;
      if (p.y >= p.landY) {
        p.landed = 1;
        ring(p.x, p.y, "rgba(238,170,190,0.85)", 0.5);
        tone(pentaFreq(5 + Math.floor(Math.random() * 5)), { decay: 0.5, gain: 0.035 });
        const [u, v] = texCoord(p.x, p.y);
        splat(u, v, 0, 0, [0.01, 0.18, 0.06], 1.6);  // ほのかな桜色のにじみ
      }
    } else {
      p.life -= dt / 7;  // 水面でゆっくり流れて消える
      p.x += 6 * dt;
      p.rot += p.vrot * 0.2 * dt;
    }
  }

  function drawPetal(p) {
    ctx2.save();
    ctx2.translate(p.x * DPR, p.y * DPR);
    ctx2.rotate(p.rot);
    ctx2.scale(DPR, DPR);
    ctx2.globalAlpha = 0.85 * Math.max(0, Math.min(1, p.life));
    ctx2.fillStyle = "#f5b8c8";
    ctx2.beginPath();  // 先端に切れ込みのある桜の花弁
    ctx2.moveTo(0, 5);
    ctx2.quadraticCurveTo(-6, -1, -3.4, -5);
    ctx2.quadraticCurveTo(-1.5, -3.4, 0, -4.6);
    ctx2.quadraticCurveTo(1.5, -3.4, 3.4, -5);
    ctx2.quadraticCurveTo(6, -1, 0, 5);
    ctx2.fill();
    ctx2.restore();
  }

  function update(dt, now, hidden) {
    ctx2.clearRect(0, 0, cv.width, cv.height);
    if (hidden) return;  // おやすみ中は描かない
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      r.t += dt;
      const k = r.t / 0.5;
      if (k >= 1) { rings.splice(i, 1); continue; }
      const ease = 1 - Math.pow(1 - k, 3);
      ctx2.globalAlpha = 0.55 * (1 - k);
      ctx2.strokeStyle = r.color;
      ctx2.lineWidth = (3 - 2 * k) * DPR;
      ctx2.beginPath();
      ctx2.arc(r.x * DPR, r.y * DPR, (8 + (r.max - 8) * ease) * DPR, 0, Math.PI * 2);
      ctx2.stroke();
    }
    ctx2.globalAlpha = 1;
    for (let i = petals.length - 1; i >= 0; i--) {
      stepPetal(petals[i], dt);
      if (petals[i].life <= 0) { petals.splice(i, 1); continue; }
      drawPetal(petals[i]);
    }
    for (const f of fishes) {
      if (typeof iconMode !== "undefined" && iconMode) {
        // アイコン撮影: 緋鯉を中央にやや右上向きで固定（泳がせない）
        f.x = innerWidth * 0.5; f.y = innerHeight * 0.52; f.angle = -0.18; f.jump = 0;
        if (!location.search.includes("nofish")) drawFish(f, now);
      } else {
        stepFish(f, dt, now); drawFish(f, now);
      }
    }
  }

  return { resize, ring, fishTarget, fishJump, sakura, update };
})();

/* ---------------- 傾きで墨が流れる（DeviceOrientation） ----------------
 * iOS は権限ダイアログが必要 → 親パネルの操作（user gesture）からのみ要求。
 * Android 等の権限不要環境は設定が ON なら起動時から有効。 */
let tiltX = 0, tiltY = 0, tiltActive = false;
function startTiltListener() {
  if (tiltActive) return;
  tiltActive = true;
  settings.tilt = true; saveSettings();
  window.addEventListener("deviceorientation", (e) => {
    if (e.gamma == null || e.beta == null) return;
    tiltX = Math.max(-1, Math.min(1, e.gamma / 35));   // 左右
    tiltY = Math.max(-1, Math.min(1, e.beta / 35));    // 前後
  });
}
function enableTilt(fromGesture) {
  const D = window.DeviceOrientationEvent;
  if (D && typeof D.requestPermission === "function") {
    if (!fromGesture) return;  // iOS はユーザー操作起点でしか権限要求できない
    D.requestPermission().then((s) => {
      if (s === "granted") { startTiltListener(); refreshPanel(); }
    }).catch(() => {});
  } else {
    startTiltListener();
  }
}
if (settings.tilt) enableTilt(false);
function applyTilt() {
  if (!tiltActive) return;
  const mag = Math.hypot(tiltX, tiltY);
  if (mag < 0.14) return;  // 机に置いたら止まるデッドゾーン
  for (let i = 0; i < 2; i++) {
    splatVelocityOnly(Math.random(), Math.random(),
      tiltX * config.SPLAT_FORCE * 0.02 * mag,
      -tiltY * config.SPLAT_FORCE * 0.02 * mag, 8);
  }
}

// デバッグプローブ: GPU テクスチャ/キャンバスの中心画素を直接読んで段階別に確認
function probeTex(label, fbo, u, v) {
  try {
    const px = new Float32Array(4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo.fbo);
    gl.readPixels(Math.floor(fbo.width * (u ?? 0.5)), Math.floor(fbo.height * (v ?? 0.5)), 1, 1, gl.RGBA, gl.FLOAT, px);
    console.log("SUMI probe " + label + ": " + Array.from(px).map((x) => x.toFixed(3)).join(","));
  } catch (e) { console.log("SUMI probe " + label + " failed: " + e.message); }
}
function probeTexMean(label) {
  try {
    const w = dye.read.width, h = dye.read.height;
    const buf = new Float32Array(w * h * 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, dye.read.fbo);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.FLOAT, buf);
    let sum = 0;
    for (let i = 0; i < w * h; i++) sum += Math.max(buf[i * 4], buf[i * 4 + 1], buf[i * 4 + 2]);
    const mean = sum / (w * h);
    console.log("SUMI probe " + label + ": " + mean.toFixed(4));
    return mean;
  } catch (e) { console.log("SUMI probe " + label + " failed: " + e.message); return null; }
}
// 墨量回帰ガード: 「Ryo実機FB×3で調整した実効墨量」を機械的に守る。
// 新機能（係数・追加注入源・攪拌）で実質的に墨が増えると verify.sh がこの FAIL を検出する
function inkBudgetCheck(label, mean, limit) {
  if (mean != null && mean > limit) console.log("SUMI FAIL: ink-budget " + label + " " + mean.toFixed(4) + " > " + limit);
}
function probeCanvas(label) {
  const px = new Uint8Array(4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.readPixels(Math.floor(gl.drawingBufferWidth / 2), Math.floor(gl.drawingBufferHeight / 2), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  console.log("SUMI canvas " + label + ": " + Array.from(px).join(","));
}

// 検証用シード: 初回ペイント前に数ストローク分を物理ステップ込みで合成描画する。
// headless Chrome は初回ペイント直後を撮るため、タイマー依存だと墨が写らない。
function seedDemo() {

  // 細線化（2026-06-11）で「線が数値拡散で消える」回帰を検知する:
  // 実 inkStroke パラメータで直線を引き、注入点の墨を直後と60ステップ後に測る
  strokeInk = null; strokeDistAcc = 1;
  for (let i = 0; i < 80; i++) {
    inkStroke(innerWidth * (0.15 + i * 0.007), innerHeight * 0.85, 9.5, 0);
    step(1 / 60);
  }
  probeTex("dye-stroke-fresh", dye.read, 0.43, 0.15);
  for (let i = 0; i < 60; i++) step(1 / 60);
  // 線は流れで「移動」するため固定点でなく帯域（v=0.05..0.45）の最大値で残存を測る
  const strokeAfter = (() => {
    try {
      const w = dye.read.width, h = dye.read.height;
      const y0 = Math.floor(h * 0.05), rows = Math.floor(h * 0.40);
      const buf = new Float32Array(w * rows * 4);
      gl.bindFramebuffer(gl.FRAMEBUFFER, dye.read.fbo);
      gl.readPixels(0, y0, w, rows, gl.RGBA, gl.FLOAT, buf);
      let mx = 0;
      for (let i = 0; i < w * rows; i++) mx = Math.max(mx, buf[i * 4], buf[i * 4 + 1], buf[i * 4 + 2]);
      console.log("SUMI probe dye-stroke-after60-bandmax: " + mx.toFixed(3));
      return mx;
    } catch (e) { return null; }
  })();
  // 1秒後も視認できる濃さ（dye>=0.10 ≈ 紙より23%暗い）がどこにも残っていなければ FAIL
  if (strokeAfter != null && strokeAfter < 0.10) console.log("SUMI FAIL: stroke-vanish " + strokeAfter.toFixed(3) + " < 0.10");

  // --- 段階別プローブ（画面中心に1滴 → 各段階の値を記録） ---
  splat(0.5, 0.5, 0, 0, [0.6, 0.6, 0.6], 4);
  probeTex("dye-after-splat", dye.read, 0.5, 0.5);
  step(1 / 60);
  probeTex("dye-after-1step", dye.read, 0.5, 0.5);
  render();
  probeCanvas("after-render");
  // --- 決定論ストローク: (0.30,0.65)→(0.54,0.65) の直線。経路上を計測 ---
  const a0 = modeInks()[0].a;
  for (let i = 0; i < 60; i++) {
    splat(0.30 + i * 0.004, 0.65, 0.004 * config.SPLAT_FORCE * 0.5, 0,
          [a0[0] * 0.28, a0[1] * 0.28, a0[2] * 0.28], 1.2);
    step(1 / 60);
  }
  probeTex("dye-on-line", dye.read, 0.45, 0.65);
  probeTex("vel-on-line", velocity.read, 0.45, 0.65);
  // --- inkDrop 検証: 注入直後と60ステップ後 ---
  inkDrop(innerWidth * 0.7, innerHeight * 0.6, true);
  probeTex("dye-at-drop", dye.read, 0.7, 0.4);
  for (let i = 0; i < 60; i++) step(1 / 60);
  probeTex("dye-at-drop-after60", dye.read, 0.7, 0.4);
  // --- 飽和ガード検証: 同一点に20連打しても MAX_DYE を超えない（真っ黒防止） ---
  for (let i = 0; i < 20; i++) inkDrop(innerWidth * 0.3, innerHeight * 0.3, true);
  probeTex("dye-after-20taps", dye.read, 0.3, 0.7);
  // --- タップ連打型の遊び（1歳の主操作）: 散らした大タップ30回 → 被覆率を機械検証 ---
  for (let i = 0; i < 30; i++) {
    inkDrop(innerWidth * (0.1 + 0.8 * ((i * 0.37) % 1)),
            innerHeight * (0.1 + 0.8 * ((i * 0.61) % 1)), true);
    for (let k = 0; k < 3; k++) step(1 / 30);
  }
  // baseline 0.14（2026-06-12 v4.3-kirei 実測。v4.2: 0.26 / v4.1: 0.40 — Ryo FB 4回で段階削減）。
  // 0.20 超え = 注入量の実質増加 = 回帰（Ryo FB と逆行する変更を機械ブロック）
  inkBudgetCheck("30taps", probeTexMean("mean-dye-after-30taps"), 0.20);
  // --- 長時間遊びシミュレーション（軽量版・SwiftShaderで完走できる規模） ---
  // なぞり10秒相当（60Hz pointermove×600・dtは6倍で時間圧縮）+ タップ10回 + 放置回復。
  // 平均墨密度（被覆率の代理）が「画面が真っ黒」(>0.8) に届かないことを機械検証
  strokeDistAcc = 0; strokeInk = null;
  for (let f = 0; f < 600; f++) {
    const t = f / 600;
    const px2 = innerWidth * (0.1 + 0.8 * Math.abs((t * 7) % 2 - 1));
    const py2 = innerHeight * (0.1 + 0.8 * Math.abs((t * 3) % 2 - 1));
    inkStroke(px2, py2, 8, 5);
    if (f % 60 === 0) inkDrop(innerWidth * (0.2 + 0.6 * ((f * 0.0062) % 1)), innerHeight * (0.2 + 0.6 * ((f * 0.0101) % 1)), true);
    step(1 / 10);  // dt を6倍にして消散・移流の実時間60秒分を圧縮
  }
  inkBudgetCheck("play", probeTexMean("mean-dye-after-play"), 0.10);
  for (let i = 0; i < 100; i++) step(1 / 10);  // 操作をやめて実時間10秒分: 回復するか
  inkBudgetCheck("rest", probeTexMean("mean-dye-after-rest"), 0.03);
  // --- ここから通常のシードストローク ---
  for (let s = 0; s < 4; s++) {
    let x = 0.2 + Math.random() * 0.6;
    let y = 0.25 + Math.random() * 0.5;
    let ang = Math.random() * Math.PI * 2;
    const a = modeInks()[autoIdx++ % modeInks().length].a;
    const steps = 50 + Math.floor(Math.random() * 50);
    for (let i = 0; i < steps; i++) {
      ang += (Math.random() - 0.5) * 0.5;
      const vx = Math.cos(ang) * 0.004, vy = Math.sin(ang) * 0.004;
      x += vx; y += vy;
      if (x < 0.05 || x > 0.95 || y < 0.05 || y > 0.95) break;
      splat(x, y, vx * config.SPLAT_FORCE * 0.5, vy * config.SPLAT_FORCE * 0.5,
            [a[0] * 0.28, a[1] * 0.28, a[2] * 0.28], 0.55);  // 実ストロークと同じ細さ
      step(1 / 60);
    }
    for (let i = 0; i < 30; i++) step(1 / 60); // にじませる
  }
  inkDrop(innerWidth * 0.7, innerHeight * 0.6, true);
  for (let i = 0; i < 60; i++) step(1 / 60);
}
function seedVis() {
  // 実 inkStroke で S字を1本（ユーザーが指でなぞったのと同一経路のコード）
  strokeInk = null; strokeDistAcc = 1;
  let px = innerWidth * 0.15, py = innerHeight * 0.55;
  for (let i = 1; i <= 120; i++) {
    const t = i / 120;
    const cx = innerWidth * (0.15 + 0.5 * t);
    const cy = innerHeight * (0.55 + 0.18 * Math.sin(t * Math.PI * 2));
    inkStroke(cx, cy, cx - px, cy - py);
    px = cx; py = cy;
    step(1 / 60);
  }
  for (let i = 0; i < 60; i++) step(1 / 60);
  // 実 inkDrop でタップ2発
  inkDrop(innerWidth * 0.78, innerHeight * 0.3, true);
  for (let i = 0; i < 60; i++) step(1 / 60);
  inkDrop(innerWidth * 0.85, innerHeight * 0.65, true);
  for (let i = 0; i < 30; i++) step(1 / 60);
  // 混色テスト: 赤+青+黄を同じ場所に重ねても黒く濁らないこと（綺麗さ優先の混色の視覚検証）
  const inks = modeInks();
  for (let k = 0; k < 3; k++) {
    inkDrop(innerWidth * 0.30, innerHeight * 0.25, true, { def: inks[k] });
    for (let i = 0; i < 20; i++) step(1 / 60);
  }
}
function seedIcon() {
  // 実 splat / inkDrop（=本物の墨流しエンジン）で、正方形アイコン向けに綺麗に構図する。
  // 中央は緋鯉を置くため少し空け、鮮やかな数色の流れる筋で囲む。
  const inks = modeInks();
  const W = innerWidth, H = innerHeight;
  // 3色だけで綺麗に魅せる（暖色の緋鯉を引き立てる寒色系: 藍・紫・緑）。
  // inks: 0=あか 1=あお 2=きいろ 3=みどり 4=だいだい 5=むらさき
  // 黄・青・緑の3色だけ。きいろ(黄)は濃いと橙〜赤に寄るので k を小さく＝薄めに保つ。
  // ストロークは各色1本ずつ（計3本）で赤化と過密を防ぎ、3色を均等に見せる。
  const YEL = inks[2], BLU = inks[1], GRN = inks[3];
  // ⚠️ きいろは高密度で赤くレンダリングされる（R吸収0.03→Rだけ残り赤化）。
  // → 黄は最も薄く＆最上部に限定し、中央へ集まらないよう流速も抑える。
  const pal = [
    { a: YEL.a, k: 0.11 },   // 0=きいろ（黄）最も薄く（赤化防止）
    { a: BLU.a, k: 0.28 },   // 1=あお（青）
    { a: GRN.a, k: 0.26 },   // 2=みどり（緑）
  ];
  const strokes = [
    { c: 0, p: [0.20, 0.22, 0.50, 0.13, 0.80, 0.21] },  // 最上部（黄・薄く）
    { c: 1, p: [0.84, 0.34, 0.80, 0.60, 0.52, 0.82] },  // 右→下（青）
    { c: 2, p: [0.18, 0.82, 0.30, 0.54, 0.18, 0.28] },  // 左で渦（緑）
  ];
  if (location.search.includes("noseed")) return;  // 切り分け用: シードしない
  for (const s of strokes) {
    const { a, k } = pal[s.c];
    const [x0, y0, x1, y1, x2, y2] = s.p;
    let prevx = x0, prevy = y0;
    const n = 72;
    for (let i = 1; i <= n; i++) {
      const t = i / n, mt = 1 - t;
      const x = mt * mt * x0 + 2 * mt * t * x1 + t * t * x2;
      const y = mt * mt * y0 + 2 * mt * t * y1 + t * t * y2;
      const vx = x - prevx, vy = y - prevy; prevx = x; prevy = y;
      // 流速を抑える（×0.25）＝インクを中央に集めず描いた場所に留める
      splat(x, y, vx * config.SPLAT_FORCE * 0.25, vy * config.SPLAT_FORCE * 0.25,
            [a[0] * k, a[1] * k, a[2] * k], 0.55);
      step(1 / 60);
    }
    for (let i = 0; i < 14; i++) step(1 / 60);  // 軽くにじませる（流しすぎない）
  }
}

let ghost = null; // 仮想の筆 {x, y, angle, speed, turn, ttl, ink}
function updateGhost(dt) {
  const now = Date.now();
  if (now - lastTouchAt < config.IDLE_MS || washFramesLeft > 0) { ghost = null; return; }
  if (!ghost) {
    if (Math.random() > dt * 0.5) return; // 平均2秒に1回ストローク開始
    const edge = Math.random();
    ghost = {
      x: 0.15 + Math.random() * 0.7,
      y: 0.2 + Math.random() * 0.6,
      angle: Math.random() * Math.PI * 2,
      speed: 0.06 + Math.random() * 0.10,
      turn: (Math.random() - 0.5) * 2.4,
      ttl: 2.5 + Math.random() * 3.5,
      ink: nextDef().a,
    };
  }
  ghost.angle += ghost.turn * dt;
  if (Math.random() < dt * 1.5) ghost.turn = (Math.random() - 0.5) * 3.0;
  const vx = Math.cos(ghost.angle) * ghost.speed;
  const vy = Math.sin(ghost.angle) * ghost.speed;
  ghost.x += vx * dt;
  ghost.y += vy * dt;
  ghost.ttl -= dt;
  if (ghost.ttl < 0 || ghost.x < 0.03 || ghost.x > 0.97 || ghost.y < 0.03 || ghost.y > 0.97) {
    ghost = null;
    return;
  }
  const ink = [ghost.ink[0] * 0.05, ghost.ink[1] * 0.05, ghost.ink[2] * 0.05];
  splat(ghost.x, ghost.y, vx * config.SPLAT_FORCE * 0.25, vy * config.SPLAT_FORCE * 0.25, ink, 0.6);
}

/* ---------------- メインループ ---------------- */
let lastTime = performance.now();
function frame(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.0166);
  lastTime = now;
  if (resizeCanvas()) { initFramebuffers(true); fx.resize(); console.log("SUMI: framebuffers reinit (resize, preserved)"); }
  checkBedtime();
  if (bedtime) {
    densityDissipation = 0.8;            // おやすみ: 紙がゆっくり乾いていく
  } else if (washFramesLeft > 0) {
    washFramesLeft--;
    densityDissipation = 4.0;            // 洗い流し: 墨を急速に薄める
  } else {
    densityDissipation = config.DENSITY_DISSIPATION;
  }
  if (!stillMode && !iconMode) {         // still / icon = 視覚検証・撮影用の凍結
    applyTilt();
    if (!bedtime) updateGhost(dt);
    step(dt);
  }
  render();
  fx.update(dt, now, bedtime);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------------- 画面を消灯させない ---------------- */
async function keepAwake() {
  try { await navigator.wakeLock.request("screen"); } catch (e) { /* 非対応でもOK */ }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") keepAwake();
});
keepAwake();

/* ---------------- Service Worker ---------------- */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

/* ---------------- 起動時のウェルカム墨滴（検証/撮影モードでは出さない） ---------------- */
if (!iconMode && !visMode && !demoMode && !stillMode) {
  setTimeout(() => { inkDrop(innerWidth / 2, innerHeight * 0.45, true); }, 500);
}
</script>
